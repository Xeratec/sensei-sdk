# MCUboot is part of every build (Debug and Release); its own options are in sysbuild/mcuboot.conf. The signed image
# is TF-M and the shield app in one (merged) file. See README.md, section "Update over the air".
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Swap with revert, no scratch area: the new image is tested first and MCUboot goes back to the old one if it is not
# confirmed.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
