# Debug build: logs over RTT. Deferred logging keeps the SPI link out of the log path.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
# Never block on a full RTT buffer when no debugger is attached.
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_ASSERT=y
CONFIG_LPWAN_SHIELD_LOG_LEVEL=4

# Modem trace over RTT (second up channel "modem_trace"), for the bench: read it with the Nordic Trace Collector or
# nrfutil trace. It uses RAM and a second RTT buffer, and the SENSEI Release build has none of it.
CONFIG_NRF_MODEM_LIB_TRACE=y
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_RTT=y
