# BabbleSim: log to the native console, not RTT.
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y

# The nRF5340 HW models are compiled with the network core layout of NRF_TIMER_Type (8 bytes larger than the application
# core one), so the application core TIMER1 and TIMER2 registers are misaligned in the model. TIMER0 is at offset 0.
CONFIG_SENSEI_TIMESYNC_TIMER=0

# The HW models run on a 1 us grid: a TIMER compare closer than 2 us (32 counts) to the end of an RTC tick can come after
# the clear by the next tick and is lost.
CONFIG_SENSEI_TIMESYNC_PPS_GUARD_COUNTS=32
