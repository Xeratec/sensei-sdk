---

name: CI • Zephyr tests (native_sim)

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: twister-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  twister:
    name: Twister on native_sim
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The west workspace is the parent folder of the repository (ws/), made from scripts/west-twister.yml:
      # NCS v3.4.1 without the projects the tests do not need.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ws/sensei-sdk

      - name: Install host tools
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          build-essential device-tree-compiler gperf ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          # ws/* and not ws: the exclusion only works against a glob, otherwise the cache restores an old SDK copy
          path: |
            ws/*
            !ws/sensei-sdk
          key: twister-ws2-${{ runner.os }}-${{ hashFiles('ws/sensei-sdk/scripts/west-twister.yml') }}

      - name: Checkout code again (after the cache restore)
        uses: actions/checkout@v4
        with:
          path: ws/sensei-sdk

      - name: Check that the tested code is the pushed commit
        run: test "$(git -C ws/sensei-sdk rev-parse HEAD)" = "$GITHUB_SHA" && git -C ws/sensei-sdk diff --quiet

      - name: West workspace
        working-directory: ws
        run: |
          python -m pip install --quiet west==1.5.0
          [ -d .west ] || west init -l --mf scripts/west-twister.yml sensei-sdk
          west update --narrow --fetch-opt=--depth=1

      - name: Python packages of Twister
        run: >
          python -m pip install --quiet
          -r ws/zephyr/scripts/requirements-base.txt
          -r ws/zephyr/scripts/requirements-build-test.txt
          tabulate natsort "gcovr>=8.3,<9"

      # --coverage: gcov data of every native_sim test, one report of the SDK sources (no threshold)
      - name: Run Twister
        env:
          SENSEI_NCS_WORKSPACE: ${{ github.workspace }}/ws
          TWISTER_OUT: ${{ runner.temp }}/twister
        run: ws/sensei-sdk/scripts/twister.sh --host --coverage

      - name: Coverage summary
        if: ${{ always() }}
        run: |
          f="${{ runner.temp }}/twister/twister-out/coverage/coverage-summary.txt"
          if [ -f "$f" ]; then
            { echo '### Coverage of the SDK sources (native_sim)'; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: twister-reports
          path: |
            ${{ runner.temp }}/twister/twister-out/twister.xml
            ${{ runner.temp }}/twister/twister-out/twister.json
          if-no-files-found: ignore

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: twister-coverage
          path: ${{ runner.temp }}/twister/twister-out/coverage
          retention-days: 14
          if-no-files-found: ignore
