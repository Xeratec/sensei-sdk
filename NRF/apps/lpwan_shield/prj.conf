# Link protocol of the SDK library sensei_lpwan (selects sensei_link: framing, nanopb glue, messages).
CONFIG_SENSEI_LPWAN_PROTO=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_ASYNC=y
CONFIG_PM_DEVICE=y

# Memory
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Networking: the modem's offloaded socket API only
CONFIG_NET_NATIVE=n
CONFIG_NRF_MODEM_LIB_NET_IF=n
CONFIG_DATE_TIME_NTP=n

# Watchdog: task watchdog (the link thread) with the hardware watchdog as fallback; a modem fault resets the chip.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_REBOOT=y

# Field diagnostics: reset cause, boot count and the last fatal error (also of the modem core) in retained RAM,
# reported to the nRF5340 in LpwanStatus. The fatal handler records the error and resets the chip.
CONFIG_SENSEI_DIAG=y

CONFIG_SIZE_OPTIMIZATIONS=y
