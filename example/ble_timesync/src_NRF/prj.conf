## Time synchronization library (role: master.conf or follower.conf) ##
CONFIG_SENSEI_TIMESYNC=y

## Bluetooth ##
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="SENSEI-TS"
CONFIG_BT_HCI_VS_EVT_USER=y
# The central sets the connection parameters. A peripheral that asks for others would change the timing.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

## Logging on RTT ##
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

## Application ##
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Per-match logging (master): uncomment
# CONFIG_APP_LOG_LEVEL_DBG=y
