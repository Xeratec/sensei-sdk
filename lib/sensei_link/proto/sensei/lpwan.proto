// nRF5340 (SPI master) to nRF9151 (SPI slave) on the LPWAN shield (lib/sensei_lpwan). The nRF5340
// sends a LpwanRequest, the nRF9151 answers with a LpwanResponse (same seq) and sends LpwanEvent on
// its own.

syntax = "proto3";

package sensei;

import "sensei/types.proto";

enum LteMode {
  LTE_M = 0;
  LTE_NB_IOT = 1;
}

enum LoraRegion {
  REGION_EU868 = 0;
  REGION_US915 = 1;
  REGION_AS923 = 2;
  REGION_AU915 = 3;
  REGION_KR920 = 4;
  REGION_IN865 = 5;
  REGION_RU864 = 6;
}

enum LoraClass {
  CLASS_A = 0;
  CLASS_B = 1;
  CLASS_C = 2;
}

enum LpwanResult {
  LPWAN_OK = 0;
  LPWAN_BUSY = 1;
  LPWAN_INVALID = 2;
  LPWAN_UNSUPPORTED = 3;
  LPWAN_NOT_CONFIGURED = 4;
  LPWAN_NOT_JOINED = 5;
  LPWAN_NOT_CONNECTED = 6;
  LPWAN_NO_NETWORK = 7;
  LPWAN_TIMEOUT = 8;
  LPWAN_DUTY_CYCLE = 9;
  LPWAN_FAILED = 10;
}

message LteConfigure {
  LteMode mode = 1;
  // Power saving mode: requested periodic TAU and active time, s (0 = off).
  uint32 psm_tau_s = 2;
  uint32 psm_active_s = 3;
  // eDRX cycle and paging time window, ms (0 = off).
  uint32 edrx_cycle_ms = 4;
  uint32 edrx_ptw_ms = 5;
  string apn = 6;
  string server_host = 7;
  uint32 server_port = 8;
  bool udp = 9; // true: UDP, false: TCP
}

message LoraConfigure {
  LoraRegion region = 1;
  LoraClass lora_class = 2;
  uint32 data_rate = 3; // 0 ... 15
  bool adr = 4;
  bool confirmed = 5;
  uint32 port = 6; // application port, 1 ... 223
}

// Keys are written at run time and are never stored in the repository. Fixed lengths.
message LoraProvision {
  bytes dev_eui = 1;  // 8 B
  bytes join_eui = 2; // 8 B
  bytes app_key = 3;  // 16 B
}

message Send {
  Radio radio = 1; // RADIO_LORA, RADIO_LTEM or RADIO_NBIOT
  uint32 port = 2;
  bytes payload = 3; // <= 1024 B
  bool confirmed = 4;
  // LTE only. Set on the last chunk of a message (the client decides from its `lte_rai` setting): LTE_RAI_LAST or
  // LTE_RAI_ONE_RESP. The shield sets the RAI socket option for this send. With LTE_RAI_ONE_RESP it also waits for the
  // answer of the server (an ack or a downlink): tx_done is ok only if one came, and TxDone.acked is set.
  LteRai rai = 5;
}

// ---- Update of the shield ----
//
// Flow: dfu_begin, dfu_chunk until the end, dfu_finish (SHA-256 of what was written), dfu_apply. The shield writes
// the image into its second MCUboot slot (target APP) or hands a delta patch to the modem (target MODEM). After an
// APP apply the master cuts the shield power and powers it again: MCUboot swaps and starts the new image on trial,
// which asks for dfu_confirm. Every dfu_* answer is a DfuStatus; a refused request has a result other than LPWAN_OK
// and the status still says where the transfer is.

enum DfuTarget {
  DFU_TARGET_APP = 0;   // the shield application with TF-M (one signed MCUboot image)
  DFU_TARGET_MODEM = 1; // modem firmware, delta patch (nrf_modem_delta_dfu)
}

enum DfuState {
  DFU_STATE_IDLE = 0;      // no transfer open
  DFU_STATE_RECEIVING = 1; // `offset` is the next byte wanted
  DFU_STATE_ERASING = 2;   // modem: erasing its DFU area, ask again with dfu_status
  DFU_STATE_VERIFIED = 3;  // every byte is in and the SHA-256 matches: dfu_apply may follow
  DFU_STATE_APPLYING = 4;  // app: marked for the trial boot. modem: the update runs, ask again with dfu_status
  DFU_STATE_DONE = 5;      // modem: the new firmware runs
  DFU_STATE_FAILED = 6;    // see `fail`; dfu_abort or dfu_begin starts again
}

enum DfuFail {
  DFU_FAIL_NONE = 0;
  DFU_FAIL_STATE = 1;       // the request does not fit the state of the transfer
  DFU_FAIL_OFFSET = 2;      // dfu_chunk at another offset than the one wanted: continue at `offset`
  DFU_FAIL_SIZE = 3;        // does not fit the slot or the modem DFU area
  DFU_FAIL_IMAGE = 4;       // not an MCUboot image for this slot
  DFU_FAIL_HASH = 5;        // the written bytes do not match the SHA-256 of dfu_begin
  DFU_FAIL_DOWNGRADE = 6;   // older than the running image (MCUboot would drop it)
  DFU_FAIL_FLASH = 7;       // flash driver error, `detail` is the errno
  DFU_FAIL_MODEM = 8;       // modem library error, `detail` is its code
  DFU_FAIL_UNSUPPORTED = 9; // target not built in
  DFU_FAIL_BOARD = 10;      // an image for another board (the kind TLV is missing or differs)
  DFU_FAIL_RATE = 11;       // too many new transfers in a short time: wait and ask again (result BUSY)
}

message DfuBegin {
  DfuTarget target = 1;
  uint32 size = 2;  // bytes of the whole file
  bytes sha256 = 3; // 32 B, of the whole file
  // Keep an open transfer (also one saved before a restart of the shield) of the same target, size and SHA-256 and
  // answer its offset. Else, or if there is none, a new transfer starts at 0.
  bool resume = 4;
}

// dfu_confirm: image_id is the LpwanVersion.image_id the master saw; the shield confirms only that image. 0: any.
message DfuConfirm { fixed32 image_id = 1; }

message DfuChunk {
  uint32 offset = 1; // where `data` goes: the offset of the last answer
  bytes data = 2;    // <= DfuStatus.chunk_max
  // APP only: the bytes between the wanted offset and `offset` are 0xFF (the sender skipped them): they are erased.
  bool gap = 3;
}

message DfuStatus {
  DfuState state = 1;
  DfuTarget target = 2;
  uint32 size = 3;      // of the open transfer
  uint32 offset = 4;    // next byte wanted: everything before it is in place
  uint32 chunk_max = 5; // largest DfuChunk.data the shield takes, B
  DfuFail fail = 6;
  sint32 detail = 7;
}

message LpwanSleep {
  uint32 deep = 1; // 0: idle with modem kept registered, 1: deepest state
}

message LpwanRequest {
  uint32 seq = 1;
  oneof body {
    Empty get_version = 2;
    Empty get_status = 3;
    LteConfigure lte_configure = 4;
    Empty lte_connect = 5;
    Empty lte_disconnect = 6;
    LoraConfigure lora_configure = 7;
    LoraProvision lora_provision = 8;
    Empty lora_join = 9;
    Send send = 10;
    Empty get_time = 11;
    LpwanSleep sleep = 12;
    // LTE: connection evaluation (%CONEVAL) of the registered modem. Answered at once; the result follows as the
    // conn_eval event (it may take seconds). Needs the connected state; an older shield answers LPWAN_UNSUPPORTED.
    Empty lte_eval = 13;
    // The client has stored the fault record of the last get_status answer: the shield may forget it. The shield keeps
    // the record (and reports it with every get_status) until this arrives, so a lost answer loses nothing.
    Empty diag_ack = 14;
    // Update of the shield (nRF9151 app or modem). See DfuBegin. Tags 40 to 49 are reserved for it.
    DfuBegin dfu_begin = 40;     // open (or resume) a transfer
    DfuChunk dfu_chunk = 41;     // bytes of the image
    Empty dfu_finish = 42;       // all bytes sent: check the SHA-256
    Empty dfu_apply = 43;        // app: mark for one trial boot (the master then power-cycles the shield); modem: apply
    Empty dfu_abort = 44;        // drop the open transfer
    Empty dfu_status = 45;       // state and next offset (the resume query)
    DfuConfirm dfu_confirm = 46; // the master accepted the handshake of an image on trial (sent again until trial ends)
  }
}

message LpwanVersion {
  Version firmware = 1;
  string modem = 2;       // modem firmware, for example the Modem-E version
  uint32 protocol = 3;    // LPWAN_PROTOCOL_VERSION of lpwan_link.h; the client refuses a different value
  fixed32 image_id = 4;   // first 4 bytes of the SHA-256 of the running app image (little endian), 0: unknown
  bool trial = 5;         // the running image is on trial: the master confirms it with dfu_confirm
  uint32 dfu_targets = 6; // bit 0: the app can be updated, bit 1: the modem firmware can (0: no update support)
  string lte_modem = 7;   // firmware of the nRF91 modem (AT%SHORTSWVER), empty until the modem library has run
}

message LpwanStatus {
  bool lte_connected = 1;
  bool lora_joined = 2;
  sint32 rssi_dbm = 3;
  sint32 snr_db = 4;
  uint32 queued = 5;         // messages waiting to be sent
  uint32 dropped_events = 6; // events the shield could not queue since start (queue full)
  // queued is 1 while the LR1121 holds a LoRa frame (a send is open, or one was given up): the client keeps the
  // shield powered. late_tx_*: the result of a send that had no result event (it was given up), reported once.
  uint32 late_tx_seq = 7; // seq of that send, 0: none
  bool late_tx_ok = 8;
  // LTE, fields 20 and up. rssi_dbm is the RSRP.
  RaiSupport rai_support = 20; // what the network told the modem (LTE_LC_EVT_RAI_UPDATE), for the current cell
  uint32 lte_answers = 21;     // sends that waited for an answer (LTE_RAI_ONE_RESP) and got one, since start
  uint32 lte_no_answer = 22;   // ... and got none within the wait (sent, unconfirmed: TxDone.unconfirmed)
  // Diagnostics of the shield (lib/sensei_diag), fields 9 to 11.
  uint32 reset_cause = 9; // reset cause bits of the last start (SENSEI_RESET_*, as Status.reset_cause)
  uint32 boot_count = 10; // boots since the shield's retained RAM was lost (power cut)
  // Fatal error that ended the previous run of the shield, reported once, else absent. A fault of the modem core
  // (the shield resets itself then) has reason 0x80, `pc` in the modem firmware and `status` = the modem library's
  // NRF_MODEM_FAULT_* code, thread "modem".
  FaultRecord fault = 11;
  // LTE: false while the modem has no valid RSRP; rssi_dbm is 0 then. Not set by an older shield (reads false).
  bool rssi_valid = 12;
  // LTE activity since the shield started, for the charge counter of the node. Set when the shield counts (LTE built
  // in), absent otherwise. rrc_connected_ms wraps after 49 days: the client reads it at least that often.
  optional uint32 rrc_connected_ms = 13; // time in the RRC connected state, ms (a running period is included)
  optional uint32 attaches = 14;         // registrations with the network
  optional uint32 psm_entries = 15;      // times the modem went into PSM (modem sleep of type PSM)
}

message NetworkTime {
  fixed32 unix_time = 1;
  Radio radio = 2;
}

// Answer to an accepted Send.
message SendInfo {
  // Expected time from the request to tx_done, ms: LoRa duty-cycle wait of the LR1121 plus airtime and
  // receive windows, at most 10 min. 0: not known (LTE, or an older shield): use the default.
  uint32 expected_ms = 1;
  // LoRa: payload bytes the LR1121 takes in the next uplink (MAC answers it owes are counted), 0: not known. Also in
  // the answer to a send that was refused as too long (result LPWAN_INVALID), so the client can chunk again.
  uint32 next_max_payload = 2;
  // Only with result LPWAN_BUSY. LoRa: seq of the earlier send whose frame the LR1121 still holds (its tx_done comes
  // under that seq); expected_ms is the time left for it. 0: no such frame; expected_ms is then the time after which a
  // new send may be accepted (the duty-cycle wait is longer than a send may take, or MAC answers are being flushed).
  uint32 queued_seq = 3;
}

message LpwanResponse {
  uint32 seq = 1;
  LpwanResult result = 2;
  oneof payload {
    LpwanVersion version = 3;
    LpwanStatus status = 4;
    NetworkTime time = 5;
    SendInfo send = 6;
    DfuStatus dfu = 40; // answer to every dfu_* request
  }
}

message RadioEvent { Radio radio = 1; }

// One per Send request at most: the first result wins, a later one for the same seq is not sent.
message TxDone {
  uint32 seq = 1; // seq of the Send request
  bool ok = 2;
  uint32 attempts = 3;
  // LoRa: payload bytes the LR1121 takes in the next uplink (the MAC answers it still owes are counted), 0: not known.
  uint32 next_max_payload = 4;
  // LTE with LTE_RAI_ONE_RESP: the server's answer arrived. Otherwise false.
  bool acked = 5;
  // LTE with LTE_RAI_ONE_RESP: the datagram went out but no answer came within the wait. ok is true then (the send is
  // not failed: the answer may be lost or late, the client decides what to do). Never together with acked.
  bool unconfirmed = 6;
}

message DownlinkRx {
  Radio radio = 1;
  uint32 port = 2;
  bytes payload = 3; // <= 1024 B
}

message LpwanError {
  LpwanResult code = 1;
  string message = 2;
}

// LTE connection evaluation (AT%CONEVAL), the answer to lte_eval.
enum EnergyEstimate {
  ENERGY_UNKNOWN = 0;   // the evaluation failed or the modem gave no value
  ENERGY_EXCESSIVE = 1; // bad: connection set-up is hard, maximum repetitions may be needed
  ENERGY_INCREASED = 2; // poor: retries and more repetitions
  ENERGY_NORMAL = 3;
  ENERGY_REDUCED = 4;   // good
  ENERGY_EFFICIENT = 5; // excellent
}

// RAI configuration of the cell, as the modem reports it (%RAI).
enum RaiSupport {
  RAI_UNKNOWN = 0; // no report yet
  RAI_NONE = 1;    // the network supports neither
  RAI_AS = 2;      // access stratum RAI (LTE-M and NB-IoT user plane)
  RAI_CP = 3;      // control plane RAI (NB-IoT)
  RAI_AS_CP = 4;
}

message ConnEval {
  bool valid = 1; // false: no result (not registered, radio busy, not supported); the rest is 0
  EnergyEstimate energy = 2;
  sint32 rsrp_dbm = 3;
  sint32 rsrq_db = 4;
  uint32 ce_level = 5;        // coverage enhancement level 0 ... 3
  uint32 tx_repetitions = 6;  // estimated
  RaiSupport rai_support = 7; // as in LpwanStatus, so that the client learns it without asking for the status
  bool rsrp_valid = 8;        // the modem gave a valid RSRP (rsrp_dbm is 0 without it; an older shield reads false)
}

message LpwanEvent {
  oneof body {
    RadioEvent joined = 1;
    RadioEvent connected = 2;
    RadioEvent disconnected = 3;
    TxDone tx_done = 4;
    DownlinkRx downlink_rx = 5;
    NetworkTime network_time = 6;
    LpwanError error = 7;
    ConnEval conn_eval = 8;
  }
}
