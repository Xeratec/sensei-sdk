# LPWAN client without a shield: init says -ENODEV and the state is "absent"; nothing is powered, no retry, every call
# of the API fails at once without effect.
tests:
  sensei.lpwan.absent:
    platform_allow:
      - native_sim/native/64
    tags: sensei lpwan
    timeout: 60
