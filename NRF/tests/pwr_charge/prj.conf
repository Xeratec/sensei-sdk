CONFIG_ZTEST=y
CONFIG_SENSEI=y
CONFIG_SENSEI_PWR=y
CONFIG_SENSEI_PWR_CHARGE=y
CONFIG_SENSEI_PWR_BOOT_RAILS=y
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_ADC=y
CONFIG_ADC_EMUL=y
CONFIG_THREAD_NAME=y
# Hours of simulated time must not take hours
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
# Settings on the flash simulator of native_sim
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The record has to survive the writes of two contexts (power thread, test thread)
CONFIG_RETENTION_MUTEX_FORCE_DISABLE=y
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
CONFIG_REBOOT=y
