CONFIG_ZTEST=y
CONFIG_SENSEI_LPWAN=y
CONFIG_SENSEI_LPWAN_SIM=y
# Nobody listens on this port: the shield never boots, the bring-up fails after the boot timeout
CONFIG_SENSEI_LPWAN_SIM_TARGET="127.0.0.1:9"
CONFIG_SENSEI_LPWAN_BOOT_TIMEOUT_MS=500
CONFIG_SENSEI_LPWAN_LORA=y
CONFIG_SENSEI_LPWAN_LTE=y
CONFIG_SENSEI_LPWAN_STACK_SIZE=4096
# the first bring-up after a start waits 180 s (a shield swap may be running): do not wait in real time
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
