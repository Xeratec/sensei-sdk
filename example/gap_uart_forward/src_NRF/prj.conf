## Enable SENSEI SDK ##
CONFIG_SENSEI=y
CONFIG_SENSEI_PWR=y

## Enable Drivers (required by the SENSEI power subsystem) ##
CONFIG_LED=y
CONFIG_I2C=y
CONFIG_ADC=y

## Console / Logging on RTT ##
# The forwarded GAP9 data is written explicitly to both the USB CDC-ACM device
# and the RTT up-channel (see forward_thread). Keep the nRF's own console and
# log output on RTT only, so the USB port stays a clean, data-only channel for
# a host tool while RTT shows logs interleaved with the forwarded data.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

## USB CDC-ACM (default console UART, used here as the forwarding sink) ##
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y

## GAP UART (uart3): asynchronous, DMA-backed reception ##
CONFIG_UART_ASYNC_API=y
CONFIG_UART_3_ASYNC=y
CONFIG_UART_3_INTERRUPT_DRIVEN=n
CONFIG_UART_3_NRF_HW_ASYNC=y
CONFIG_UART_3_NRF_HW_ASYNC_TIMER=1

## USB CDC-ACM uses the interrupt-driven API and needs the DTR line ctrl ##
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

## Optionally enable MCUboot (this can complicate debugging with RTT) ##
CONFIG_BOOTLOADER_MCUBOOT=n
