---
# The trial supervision of NRF/system/ota (sensei_ota.c) in the scenarios of the link rule. Each one needs a fresh boot:
# an image is confirmed once, and a reset ends the run.
common:
  platform_allow:
    - native_sim/native/64
  tags: sensei ota
tests:
  sensei.ota.trial:
    # the check passes before the first SMP request; the first confirm write fails; image id from the flash
    timeout: 60
  sensei.ota.trial.early_link:
    extra_configs:
      - CONFIG_SENSEI_TEST_EARLY_LINK=y
  sensei.ota.trial.no_link:
    extra_configs:
      - CONFIG_SENSEI_TEST_NO_LINK=y
  sensei.ota.trial.link_not_needed:
    extra_configs:
      - CONFIG_SENSEI_TEST_NO_LINK=y
      - CONFIG_SENSEI_OTA_CONFIRM_NEEDS_LINK=n
  sensei.ota.trial.unhealthy:
    extra_configs:
      - CONFIG_SENSEI_TEST_UNHEALTHY=y
  sensei.ota.trial.host_confirm:
    extra_configs:
      - CONFIG_SENSEI_TEST_HOST_CONFIRM=y
      - CONFIG_SENSEI_OTA_CONFIRM=n
  sensei.ota.trial.already_confirmed:
    extra_configs:
      - CONFIG_SENSEI_TEST_ALREADY_CONFIRMED=y
  # The key store of lib/sensei_secure with the OTA module: the plain key record that the migration to sealed keys keeps
  # for a revert is deleted when the image is confirmed (CONFIG_SENSEI_SECURE_SETTINGS_CONFIRM_ON_OTA).
  sensei.ota.trial.e2e_confirm:
    extra_configs:
      - CONFIG_SENSEI_TEST_E2E_CONFIRM=y
      - CONFIG_SENSEI_SECURE=y
      - CONFIG_SENSEI_SECURE_SETTINGS=y
      - CONFIG_SENSEI_SECURE_SETTINGS_SEAL=y
      - CONFIG_SENSEI_SECURE_SETTINGS_SEAL_TEST_KEY=y
      - CONFIG_MBEDTLS_ENABLE_HEAP=y
      - CONFIG_MBEDTLS_HEAP_SIZE=16384
      - CONFIG_MAIN_STACK_SIZE=16384
      - CONFIG_ZTEST_STACK_SIZE=16384
      - CONFIG_FLASH=y
      - CONFIG_FLASH_MAP=y
      - CONFIG_NVS=y
      - CONFIG_SETTINGS=y
      - CONFIG_SETTINGS_NVS=y
