# Simulated shield on native_sim (sim/README.md): the link to the nRF5340 is a socket, the LTE modem and the LR1121 are
# fakes, the LTE socket is a host socket (offloaded sockets).
CONFIG_LPWAN_SHIELD_SIM=y

# no SPI slave, watchdog or bootloader on the host
CONFIG_SPI=n
CONFIG_SPI_SLAVE=n
CONFIG_SPI_ASYNC=n
CONFIG_PM_DEVICE=n
CONFIG_WATCHDOG=n
CONFIG_TASK_WDT=n
CONFIG_TASK_WDT_HW_FALLBACK=n
CONFIG_LPWAN_SHIELD_DFU=n

# UDP to the collector through the host
CONFIG_GPIO_EMUL=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# a restart of the process is the reset of the shield (a lost power, a modem fault)
CONFIG_NATIVE_SIM_REBOOT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SIZE_OPTIMIZATIONS=n
