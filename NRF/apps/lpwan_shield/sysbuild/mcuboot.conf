# MCUboot of the LPWAN shield (64 kB partition at 0x0). Signature type and swap mode come from sysbuild.conf, the key
# from Kconfig.sysbuild.

# An update must not be older than the running image (version check; the same version is allowed, so a developer
# can flash new builds of one version). MCUboot drops an older image from the second slot.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# The shield has no UART and no USB: no serial recovery. A shield with a broken app is flashed over SWD (J12).
# No log output (saves flash, the RTT channel belongs to the app).
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
