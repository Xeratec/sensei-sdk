CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_SENSEI=y
CONFIG_SENSEI_SECURE=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=524288
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SENSEI_SECURE_RATCHET=y
# The tests of the key store open many sessions and do not close all of them (the OpenSSL host build does not mind): room
# for the key slots and their key material (the heap of Mbed TLS holds it)
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4096
# Commissioning (SPAKE2+): the test of the Mbed TLS ECP backend against the RFC 9383 vectors (V9) and the others
CONFIG_SENSEI_SECURE_COMMISSION=y
CONFIG_SENSEI_SECURE_SPAKE2P_MBEDTLS_ECP=y
