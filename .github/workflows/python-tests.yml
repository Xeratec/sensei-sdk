---

name: CI • Python tests (GAP9 image builder)

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: make test-python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The test of the update writer builds lib/sensei_gap9 with nanopb (a submodule) and a C compiler.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch nanopb
        run: git submodule update --init --depth 1 lib/sensei_link/third_party/nanopb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # imgtool signs the test images. Pinned to the versions that the tests were run with.
      # CI is set by GitHub Actions: the tests then fail instead of skipping (GAP9/ssbl/tools/conftest.py).
      - name: Install test tools
        run: python -m pip install pytest==9.2.0 cryptography==50.0.2 imgtool==2.5.0

      - name: Run the tests
        run: make test-python
