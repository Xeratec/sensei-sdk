# Network core (Bluetooth controller). The same image serves master and follower.
# Console and logs on RTT.
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_HEAP_MEM_POOL_SIZE=4096

# Master: up to 4 followers as central (BT_MAX_CONN minus the peripheral count). Follower: one connection as peripheral.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1

# Time sync: the controller reports the connection anchor points and starts the application core RTC when its
# own clock starts. The IPC channel must be CONFIG_SENSEI_TIMESYNC_IPC_CHANNEL of the application.
CONFIG_BT_CTLR_SDC_CONN_ANCHOR_POINT_REPORT=y
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START=y
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START_CHANNEL=4
