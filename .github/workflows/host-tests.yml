---

name: CI • Host tests (lib, NRF/system)

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: make test-host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # make test-host builds and runs every lib/<name>/tests and NRF/system/<name>/tests (CMake, ctest). The
      # sensei_secure tests need OpenSSL 3; the sensei_link test needs the nanopb submodule.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch nanopb
        run: git submodule update --init --depth 1 lib/sensei_link/third_party/nanopb

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cmake ninja-build libssl-dev

      - name: Run the tests
        run: make test-host
