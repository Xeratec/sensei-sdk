# The node's crypto and key store (nrf5340, Oberon PSA driver) with the commissioning on: this build checks that the
# ocrypto backend compiles and links, and its size against the build without it is what the commissioning adds
# (testcase.yaml).
CONFIG_SENSEI=y
CONFIG_SENSEI_SECURE=y
CONFIG_SENSEI_SECURE_RATCHET=y
CONFIG_SENSEI_SECURE_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SENSEI_SECURE_COMMISSION=y
